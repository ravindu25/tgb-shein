name: Update NTB USD rate

on:
  schedule:
    - cron: "7 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_rate.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain rate.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add rate.json
            git commit -m "Update NTB USD rate"
            git push
          fi
